[package]
description = "Native configurator for the Cosmic Byte Blitz controller"
license = "MIT"
readme = "README"
repository = "https://github.com/varun-r-mallya/blitz-config"
keywords = ["gamepad", "controller", "hid", "cosmic-byte", "egui"]
categories = ["hardware-support", "gui"]
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README", "LICENSE", "70-cosmic-byte-blitz.rules"]
name = "blitz-config"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
hidapi = "2.6.7"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
